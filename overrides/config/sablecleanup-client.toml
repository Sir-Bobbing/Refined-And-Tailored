[moderation_coloring]
	#A sub-level's row in the /sablecleanup list turns orange once it has existed for at least this many days.
	# Default: 7.0
	# Range: 0.0 ~ 3650.0
	longLifeDays = 7.0
	#On top of longLifeDays, a sub-level's row turns red once it has also gone at least this many days without moving. Movement of loaded sub-levels is checked in the background every few seconds.
	# Default: 7.0
	# Range: 0.0 ~ 3650.0
	noMovementDays = 7.0

[live_view]
	#Live view: position updates per second requested from the server (it simulates 20 per second, so above 20 means every tick). The 3D view interpolates between updates, so motion is smooth either way; higher is more precise but costs more network time.
	# Default: 20
	# Range: 1 ~ 24
	refreshPerSecond = 20

[screenshots]
	#Height of 3D-view snaps: P480, P720, P1080, P1440 (2K) or P2160 (4K). The width follows the view's shape. Bigger takes longer to capture and uses more memory; 4K can stutter on laptops.
	#Allowed Values: P480, P720, P1080, P1440, P2160
	snapResolution = "P1080"

[remote]
	#Adds the /remotepose command: sliders for where the Sable Remote sits in first person, held and raised, and
	#the free hand. Saves to config/sablecleanup-remote-pose.json, which wins over the defaults until it's deleted.
	#Rejoin the world after turning this on.
	poseTuner = false
